services:
  app:
    build:
      context: .
      dockerfile: prod.Dockerfile
    # image: ghcr.io/sohosai/ultradonguri-controller:latest
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      TZ: Asia/Tokyo
      OBS_WEBSOCKET_URL: ${OBS_WEBSOCKET_URL:-ws://localhost:4455}
      OBS_WEBSOCKET_PASSWORD: ${OBS_WEBSOCKET_PASSWORD:-}
